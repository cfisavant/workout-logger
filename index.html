<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workout"><title>Workout</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#eef;font:20px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px 140px}
h1{font-size:26px;margin:14px 0 4px}.sub{color:#9ab;font-size:16px;margin-bottom:12px}
.ex{background:#161a20;border-radius:14px;padding:14px;margin:12px 0}.ex.done{opacity:.55}
.ex h2{margin:0 0 4px;font-size:24px}.tgt{font-size:22px;color:#7fd}.last{color:#9ab;font-size:16px}.note{color:#fc6;font-size:16px}
.set{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.set.logged{color:#7d7}
.lbl{width:54px;font-size:16px;color:#9ab}input{width:84px;font-size:26px;padding:10px;border-radius:10px;border:1px solid #345;background:#0b0d10;color:#fff;text-align:center}
button{font-size:20px;padding:14px 16px;border-radius:12px;border:0;background:#2d6cdf;color:#fff;font-weight:600;min-height:56px}
button.sec{background:#2a3038}button.ok{background:#1f9d55}
#timer{position:fixed;left:0;right:0;bottom:0;background:#161a20;border-top:2px solid #345;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;justify-content:space-between}
#tv{font-size:48px;font-variant-numeric:tabular-nums;font-weight:700}
#flash{position:fixed;inset:0;background:#fff;display:none;z-index:9;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:#000}
#flash.on{display:flex;animation:f .4s steps(2) infinite}@keyframes f{50%{background:#e11;color:#fff}}
textarea{width:100%;height:260px;font-size:16px;background:#0b0d10;color:#fff;border:1px solid #345;border-radius:10px;padding:10px}

.rir{display:flex;gap:6px;align-items:center;width:100%}.rir b{font-size:15px;color:#9ab;font-weight:400;width:54px}
.rir button{min-height:48px;min-width:48px;padding:6px;font-size:20px;background:#2a3038}.rir button.on{background:#fc6;color:#000}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
</style></head><body>
<!-- PLAN: page loads plan.json by default (or ?plan=other.json). This embedded block is only a fallback if the fetch fails. -->
<script type="application/json" id="plan">
{
  "title": "Fallback – Pull & Shoulders",
  "date": "2026-10-22",
  "unit": "lb",
  "notes": "Offline fallback (plan.json could not load)",
  "exercises": [
    {"name":"Pull-up","weight":0,"sets":4,"reps":8,"rest":120,"last":"BW x 4 x 7"},
    {"name":"DB Shoulder Press","weight":45,"sets":3,"reps":10,"rest":90,"last":"40 x 3 x 10"},
    {"name":"Seated Cable Row","weight":140,"sets":3,"reps":12,"rest":90},
    {"name":"Lateral Raise","weight":20,"sets":3,"reps":15,"rest":60,"note":"slow down 3 sec"},
    {"name":"Face Pull","weight":50,"sets":3,"reps":15,"rest":60}
  ]
}
</script>
<div id="app"></div>
<div id="timer"><button class="sec" onclick="adj(-15)">−15</button><div id="tv">0:00</div><button class="sec" onclick="adj(15)">+15</button><button class="sec" onclick="stopT()">Skip</button></div>
<div id="flash" onclick="clearFlash()">REST OVER<br>tap</div>
<script>
let rirSel={}; let plan, S, key, tEnd=0, tInt=null, ac=null, wl=null;
const $=id=>document.getElementById(id);
const fmtW=w=>w?w:'BW';
const isSec=e=>e.unit==='sec'||/\(sec\)/i.test(e.name);
const tgtR=(e,k)=>Array.isArray(e.repsBySet)&&e.repsBySet.length?(e.repsBySet[k]??e.repsBySet[e.repsBySet.length-1]):e.reps;
const nSets=e=>Array.isArray(e.repsBySet)&&e.repsBySet.length?e.repsBySet.length:e.sets;
function tgtText(e){const n=nSets(e),u=isSec(e)?' sec':'';if(Array.isArray(e.repsBySet)&&e.repsBySet.length&&!e.repsBySet.every(r=>r===e.repsBySet[0]))return `${fmtW(e.weight)} x ${e.repsBySet.join('/')}${u}`;return `${fmtW(e.weight)} x ${n} x ${tgtR(e,0)}${u}`;}
async function load(){
  const q=new URLSearchParams(location.search).get('plan');
  try{const r=await fetch(q||'plan.json',{cache:'no-store'});if(!r.ok)throw 0;plan=await r.json();}catch(e){plan=JSON.parse($('plan').textContent);}
  key='wl:'+plan.title+':'+(plan.date||'');
  S=JSON.parse(localStorage.getItem(key)||'null')||{log:plan.exercises.map(()=>[]),finished:false};
  if(S.tEnd&&S.tEnd>Date.now()){tEnd=S.tEnd;runT();}
  render();
}
function save(){S.tEnd=tEnd;localStorage.setItem(key,JSON.stringify(S));}
function render(){
  let h=`<h1>${plan.title}</h1><div class="sub">${plan.date||''} ${plan.notes?'· '+plan.notes:''}</div>`;
  if(S.finished){h+=`<h2>Log</h2><textarea id="out" readonly>${logText()}</textarea><div class="row"><button class="ok" onclick="copyLog()">Copy log</button><button class="sec" onclick="S.finished=false;save();render()">Back</button><button class="sec" onclick="resetAll()">Reset</button></div>`;$('app').innerHTML=h;return;}
  plan.exercises.forEach((e,i)=>{
    const L=S.log[i], done=L.length>=nSets(e), u=isSec(e)?' sec':'';
    h+=`<div class="ex ${done?'done':''}"><h2>${e.name}</h2><div class="tgt">${tgtText(e)} · rest ${e.rest||90}s</div>`;
    if(e.last)h+=`<div class="last">Last: ${e.last}</div>`;if(e.note)h+=`<div class="note">${e.note}</div>`;
    L.forEach((s,k)=>h+=`<div class="set logged"><span class="lbl">Set ${k+1}</span>${fmtW(s.w)} x ${s.r}${u}${s.rir!=null?' · RIR '+s.rir:''} ✓ <button class="sec" style="min-height:40px;padding:6px 10px;font-size:15px" onclick="undo(${i},${k})">undo</button></div>`);
    if(!done){const p=L.length?L[L.length-1]:{w:e.weight,r:e.reps};
      h+=`<div class="set"><span class="lbl">Set ${L.length+1}</span><input id="w${i}" type="number" inputmode="decimal" value="${p.w}" aria-label="weight">
      <input id="r${i}" type="number" inputmode="numeric" value="${tgtR(e,L.length)}" aria-label="${u?'seconds':'reps'}"><span class="lbl">${u?'sec':'reps'}</span><button class="ok" onclick="doneSet(${i})">Done set</button>
      <div class="rir"><b>RIR</b>${[0,1,2,3,4,5].map(n=>`<button class="${rirSel[i]===n?'on':''}" onclick="pickRir(${i},${n})">${n}</button>`).join('')}</div></div>`;}
    h+=`</div>`;});
  h+=`<div class="ex"><h2>Session notes</h2><textarea id="note" style="height:110px;font-size:20px" placeholder="energy, motivation, pain, swaps…" oninput="S.note=this.value;save()">${(S.note||'').replace(/</g,'&lt;')}</textarea></div>`;
  h+=`<div class="row"><button onclick="finish()">Finish</button><button class="sec" onclick="resetAll()">Reset</button></div>`;
  $('app').innerHTML=h;
}
function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0.0001;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.01);}catch(e){}
  wake();}
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null);}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();if(tEnd&&Date.now()>=tEnd)tick();}});
document.addEventListener('touchstart',unlock,{passive:true});document.addEventListener('click',unlock);
function doneSet(i){const e=plan.exercises[i];const w=parseFloat($('w'+i).value)||0,r=parseInt($('r'+i).value)||0;
  const s={w,r};if(rirSel[i]!=null)s.rir=rirSel[i];delete rirSel[i];S.log[i].push(s);startT(e.rest||90);save();render();}
function pickRir(i,n){const w=$('w'+i).value,r=$('r'+i).value;rirSel[i]=rirSel[i]===n?null:n;render();$('w'+i).value=w;$('r'+i).value=r;}
function undo(i,k){S.log[i].splice(k,1);save();render();}
function startT(s){tEnd=Date.now()+s*1000;runT();save();}
function runT(){$('timer').style.display='flex';clearInterval(tInt);tInt=setInterval(tick,250);tick();}
function tick(){const ms=tEnd-Date.now();if(ms<=0){stopT();alarm();return;}const s=Math.ceil(ms/1000);$('tv').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function adj(d){tEnd=Math.max(Date.now()+1000,tEnd+d*1000);save();tick();}
function stopT(){clearInterval(tInt);tEnd=0;$('timer').style.display='none';save();}
function beep(t,f){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.26);}
function alarm(){$('flash').classList.add('on');try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400]);}catch(e){}
  try{if(ac){ac.resume();const t=ac.currentTime;[0,.35,.7,1.2,1.55,1.9].forEach((d,k)=>beep(t+d,k%3==2?1320:880));}}catch(e){}
  setTimeout(clearFlash,8000);}
function clearFlash(){$('flash').classList.remove('on');}
function logText(){let t=`${plan.title} – ${plan.date||new Date().toISOString().slice(0,10)}\n`;
  plan.exercises.forEach((e,i)=>{const L=S.log[i];if(!L.length){t+=`${e.name}: skipped\n`;return;}
    const u=isSec(e)?' sec':'',sameW=L.every(s=>s.w===L[0].w),anyR=L.some(s=>s.rir!=null),same=sameW&&!anyR&&L.every(s=>s.r===L[0].r),n=nSets(e);
    const rr=s=>s.r+(s.rir!=null?'-'+s.rir:'');
    const tg=Array.from({length:n},(_,k)=>tgtR(e,k)),miss=L.some((s,k)=>s.r<tg[k]);
    t+=`${e.name}: `+(same?`${fmtW(L[0].w)} x ${L.length} x ${L[0].r}${u}`:sameW?`${fmtW(L[0].w)} x ${L.map(rr).join('/')}${u}`:L.map(s=>`${fmtW(s.w)}x${rr(s)}`).join('/')+u)
      +(miss?` (target ${tg.length>1?tg.slice(0,L.length).join('/'):tg[0]})`:'')+(L.length<n?` (planned ${n} sets)`:'')+`\n`;});
  if(S.note&&S.note.trim())t+=`Notes: ${S.note.trim().replace(/\s*\n\s*/g,'; ')}\n`;
  return t.trim();}
function finish(){stopT();S.finished=true;save();render();}
async function copyLog(){const t=logText();try{await navigator.clipboard.writeText(t);}catch(e){const a=$('out');a.select();document.execCommand('copy');}alert('Copied – paste to Hans');}
function resetAll(){if(confirm('Clear this workout log?')){localStorage.removeItem(key);stopT();load();}}
load();
</script></body></html>
